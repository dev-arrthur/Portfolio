name: Atualizar biografia na branch

on:
  push:
    branches:
      - feat/sobre-mim-biografia
    paths:
      - .github/workflows/update-about.yml
      - .github/about-trigger

permissions:
  contents: write

jobs:
  update-about:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch atual
        uses: actions/checkout@v4
        with:
          ref: feat/sobre-mim-biografia
          fetch-depth: 0

      - name: Atualizar somente a seção Sobre mim
        shell: python
        run: |
          from pathlib import Path
          path = Path("index.html")
          content = path.read_text(encoding="utf-8")
          old = '''          <div class="about-copy reveal">
            <span class="section-kicker">Sobre mim</span>
            <h2>Curiosidade técnica com foco em resultado.</h2>
            <p>Comecei na tecnologia aos 16 anos e construí minha trajetória colocando conhecimento em prática: sistemas, automações, integrações e produtos que ajudam empresas a trabalhar melhor.</p>
            <p>Meu foco principal está no Back-end, onde estruturo regras de negócio, APIs, dados e integrações. Também atuo com automações RPA e desenvolvimento de SaaS, sempre buscando reduzir tarefas manuais, melhorar a tomada de decisão e aumentar o rendimento das áreas.</p>
            <p>Como CEO da thynkXP, conecto visão de produto, desenvolvimento e necessidades reais de pequenos e médios empreendedores para criar soluções sustentáveis e fáceis de operar.</p>

            <div class="about-points">
              <div class="about-point"><i class="bi bi-check-circle-fill"></i> Back-end orientado ao negócio</div>
              <div class="about-point"><i class="bi bi-check-circle-fill"></i> Automação de processos reais</div>
              <div class="about-point"><i class="bi bi-check-circle-fill"></i> Visão de produto SaaS</div>
              <div class="about-point"><i class="bi bi-check-circle-fill"></i> Comunicação com áreas e clientes</div>
            </div>
          </div>'''
          new = '''          <div class="about-copy reveal">
            <span class="section-kicker">Sobre mim</span>
            <h2>Tecnologia que simplifica o trabalho e transforma operações.</h2>
            <p>Me chamo <strong>Arthur Ferreira</strong>, tenho 19 anos e sou desenvolvedor de sistemas com foco em <strong>Back-end, APIs, automações e produtos SaaS</strong>. Entrei no universo da tecnologia aos 16 anos e, desde então, construo minha trajetória por meio de estudos constantes, experiências profissionais e projetos criados para resolver problemas reais.</p>
            <p>Atualmente trabalho como <strong>Assistente de Programação Pleno | Back-End e automações na Maximum Assessoria Contábil</strong>, um escritório com mais de 50 colaboradores. Minha atuação é direcionada à criação de soluções que facilitem a rotina das equipes e contribuam para o desenvolvimento da empresa. Desenvolvo automações para envio, recebimento, organização e processamento de documentos, além de integrações com APIs governamentais e sistemas contábeis.</p>
            <p>Também presto suporte técnico em demandas relacionadas à infraestrutura, redes e servidores utilizados pelos diferentes setores. Essa proximidade com a operação me permite compreender as dificuldades dos usuários, mapear processos e transformar tarefas repetitivas em fluxos mais rápidos, seguros e confiáveis.</p>
            <p>Anteriormente, atuei como <strong>estagiário e desenvolvedor de sistemas na UsePress</strong>, participando da criação e manutenção de sites, sistemas e integrações com PHP, WordPress e outras tecnologias web. Trabalhei em projetos como a plataforma da <strong>RedeMG Farma</strong>, prestei suporte aos clientes, participei de reuniões e acompanhei soluções desde o entendimento dos requisitos até a entrega.</p>
            <p>Desde 2024, concentro meus estudos no desenvolvimento Back-end, construção de APIs, bancos de dados, segurança de aplicações e arquitetura de sistemas. Procuro entender não apenas como desenvolver uma funcionalidade, mas como criar estruturas organizadas, protegidas, escaláveis e preparadas para evoluir.</p>
            <p>Em 2025, iniciei um dos meus projetos mais importantes: uma plataforma completa de gestão e agendamento para barbearias, criada para ser comercializada como SaaS. O sistema reúne agendamentos, clientes, profissionais, serviços, comissões, assinaturas, pagamentos, produtos, indicadores e automações de atendimento. Sua página de apresentação já está disponível, enquanto a plataforma avança em direção ao lançamento completo.</p>
            <p>Também sou fundador da <strong>thynkXP</strong>, iniciativa criada para desenvolver sistemas, automações e produtos digitais capazes de aumentar a produtividade e melhorar a gestão de pequenos e médios negócios. Minha principal motivação é observar uma operação, identificar gargalos e construir soluções que economizem tempo, reduzam erros e permitam que as pessoas se concentrem no que realmente importa.</p>

            <div class="about-points">
              <div class="about-point"><i class="bi bi-check-circle-fill"></i> Back-end e APIs orientados ao negócio</div>
              <div class="about-point"><i class="bi bi-check-circle-fill"></i> Automações aplicadas a operações reais</div>
              <div class="about-point"><i class="bi bi-check-circle-fill"></i> Integrações, dados e segurança</div>
              <div class="about-point"><i class="bi bi-check-circle-fill"></i> Visão de produto e desenvolvimento SaaS</div>
            </div>
          </div>'''
          if content.count(old) != 1:
              raise SystemExit("O bloco atual do Sobre mim não foi encontrado exatamente uma vez")
          updated = content.replace(old, new, 1)
          for image in ('src="imagem1.png"', 'src="imagem3.png"'):
              if image not in updated:
                  raise SystemExit(f"Imagem manual ausente após alteração: {image}")
          path.write_text(updated, encoding="utf-8")

      - name: Remover arquivos temporários
        run: rm -f .github/workflows/update-about.yml .github/about-trigger

      - name: Registrar atualização na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-about.yml .github/about-trigger
          git commit -m "feat: amplia biografia da seção sobre mim"
          git push origin HEAD:feat/sobre-mim-biografia
